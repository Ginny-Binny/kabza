# /etc/nginx/sites-available/kabza — change server_name and cert paths
server {
    listen 443 ssl http2;
    server_name kabza.example.com;

    ssl_certificate /etc/letsencrypt/live/kabza.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabza.example.com/privkey.pem;

    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        # sockets stay open for as long as someone keeps the tab open
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 80;
    server_name kabza.example.com;
    return 301 https://$host$request_uri;
}
